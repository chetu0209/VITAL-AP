# Tiny Tapeout project information
project:
  title:        "VITAL-AP: Value-, Transition-, and Temporal-Aware Adaptive Register"
  author:       "Chethan S P"
  discord:      ""      # Add your Discord username if required
  description:  "Adaptive pixel register that suppresses unnecessary switching in image and video data using value, transition, and temporal activity awareness."
  language:     "Verilog"
  clock_hz:     50000000

  # 1x1 tile
  tiles: "1x1"

  top_module:  "tt_um_vital_ap"

  source_files:
    - "project.v"

# Pinout
pinout:
  # Inputs
  ui[0]: "PIXEL_IN[0]"
  ui[1]: "PIXEL_IN[1]"
  ui[2]: "PIXEL_IN[2]"
  ui[3]: "PIXEL_IN[3]"
  ui[4]: "PIXEL_IN[4]"
  ui[5]: "PIXEL_IN[5]"
  ui[6]: "PIXEL_IN[6]"
  ui[7]: "PIXEL_IN[7]"

  # Outputs
  uo[0]: "PIXEL_OUT[0]"
  uo[1]: "PIXEL_OUT[1]"
  uo[2]: "PIXEL_OUT[2]"
  uo[3]: "PIXEL_OUT[3]"
  uo[4]: "PIXEL_OUT[4]"
  uo[5]: "PIXEL_OUT[5]"
  uo[6]: "PIXEL_OUT[6]"
  uo[7]: "PIXEL_OUT[7]"

  # Bidirectional pins
  uio[0]: "ENABLE"
  uio[1]: "SENSITIVITY[0]"
  uio[2]: "SENSITIVITY[1]"
  uio[3]: "UPDATE"
  uio[4]: "HOLD"
  uio[5]: "ACTIVITY[0]"
  uio[6]: "ACTIVITY[1]"
  uio[7]: "UNUSED"

# Do not change!
yaml_version: 6
